[package]
name = "ci-tui"
version = "0.1.18"
edition = "2021"
description = "TUI for running and monitoring CI checks"

[lib]
name = "ci_tui"
path = "src/lib.rs"

[[bin]]
name = "ci-tui"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
ansi-to-tui = "8"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
async-trait = "0.1"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }  # Preserves YAML key order

# Error handling
thiserror = "2"
anyhow = "1"
color-eyre = "0.6"

# Utilities
regex = "1"
chrono = "0.4"
base64 = "0.23"

# System monitoring
sysinfo = "0.39"

# Test utilities (optional)
mockall = { version = "0.15", optional = true }

[features]
test = ["mockall"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
# Test framework extensions
mockall = "0.15"              # Trait-based mocking with #[automock]
rstest = "0.27"               # Test fixtures and parameterized tests
pretty_assertions = "1.4"     # Colorful assertion diffs
tempfile = "3"                # Temporary directories for testing

# Async testing support (mockall needs this for async traits)
tokio-test = "0.4"            # tokio testing utilities

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
