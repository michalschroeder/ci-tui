version: 2

docker:
  project_dir: .
  service: dev
  image: ci-tui-dev:latest
  volume_mount: "${HOST_PWD}:/build"
  work_dir: /build
  shell: bash

git:
  base_branch: master
  fallback_branch: HEAD~1

file_patterns:
  rust:
    pattern: '\.rs$'
    color: yellow
  toml:
    pattern: '\.toml$'
    color: blue
  yaml:
    pattern: '\.ya?ml$'
    color: green

ignore_patterns:
  - '\.md$'
  - '\.github/'
  - 'target/'

checks:
  quality:
    name: Code Quality
    parallel: true
    checks:
      fmt:
        name: Format Check
        command: cargo fmt -- --check {files}
        fix_command: cargo fmt -- {files}
        triggers:
          file_pattern: rust

      clippy:
        name: Clippy Lints
        command: cargo clippy -- -D warnings
        triggers:
          file_pattern: rust

  tests:
    name: Tests
    parallel: true
    checks:
      unit:
        name: Unit Tests
        command: script -q -c "cargo nextest run --lib --status-level all --color always" /dev/null
        triggers:
          file_pattern: rust

      integration:
        name: Integration Tests
        command: script -q -c "cargo nextest run --features test --test '*' --status-level all --color always" /dev/null
        triggers:
          file_pattern: rust
