# yaml-language-server: $schema=./schema/ci-tui.schema.json
version: 2

# Kill a hung check instead of blocking the run (agents wait on --simple)
timeout: 15m

# TUI: bell + desktop notification when a full run finishes
notify: true

# Plain-image mode: every check is a `docker run` of the dev image (no compose)
docker:
  image: ci-tui-dev:latest
  volume_mount: "${HOST_PWD}:/build"
  work_dir: /build
  shell: bash
  # Host uid:gid (the published image runs ci-tui as the project owner), so
  # target/ is not root-owned. No passwd entry in the image: HOME=/ otherwise.
  user: host
  env:
    HOME: /tmp
    # Keep the crate registry across `docker run --rm` containers (no
    # re-download per check). Must match the Makefile (DEV_RUN), else deps rebuild.
    CARGO_HOME: /build/target/cargo-home

git:
  base_branch: master
  fallback_branch: HEAD~1

file_patterns:
  rust:
    pattern: '\.rs$'
    color: yellow
  # Everything the crate build and tests read: Rust sources, manifests, lint
  # and nextest config, committed schema (drift test) and test fixtures. Also
  # feeds the result cache key, so a Cargo.lock / clippy.toml / nextest.toml
  # edit re-runs clippy and tests.
  crate:
    pattern: '\.rs$|^(Cargo\.(toml|lock)|clippy\.toml)$|^(schema|tests|\.config)/'
    color: blue

ignore_patterns:
  - '\.md$'
  - '^\.github/'
  - '^target/'

checks:
  # One parallel group: separate groups run in sequence, so clippy would hold
  # back every test. Measured ~19s vs ~24.5s for a one-file change.
  all:
    name: Checks
    parallel: true
    checks:
      fmt:
        name: Format Check
        command: cargo fmt -- --check {files}
        fix_command: cargo fmt -- {files}
        triggers:
          file_pattern: rust

      # Own target dir: otherwise it holds cargo's build-dir lock and the
      # tests wait for it anyway (+~1.2 GB on disk)
      clippy:
        name: Clippy Lints
        command: CARGO_TARGET_DIR=target/clippy cargo clippy --all-targets --all-features -- -D warnings
        triggers:
          file_pattern: crate

      unit:
        name: Unit Tests
        command: script -q -e -c "cargo nextest run --lib --no-fail-fast --status-level all --color always" /dev/null
        triggers:
          file_pattern: crate

      integration:
        name: Integration Tests
        command: script -q -e -c "cargo nextest run --features test --test '*' --no-fail-fast --status-level all --color always" /dev/null
        triggers:
          file_pattern: crate

      doctests:
        name: Doc Tests
        command: cargo test --doc --color always
        triggers:
          file_pattern: crate
