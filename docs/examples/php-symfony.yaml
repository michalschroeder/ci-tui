# CI-TUI Configuration for Symfony PHP Projects
#
# This is a complete working example for a typical Symfony application with:
# - PHP CS Fixer for code style (with auto-fix)
# - PHPStan for static analysis
# - PHPUnit for testing with intelligent test discovery
# - Doctrine migrations before tests
#
# Adjust paths, versions, and check configurations to match your project.

version: 2

docker:
  # Path to directory containing docker-compose.yml
  project_dir: .

  # Docker service name from docker-compose.yml
  # Assumes you have a service like:
  #   services:
  #     php:
  #       image: php:8.2-cli
  service: php

  # Optional: Explicit container name if not using standard compose naming
  # container: myproject-php-1

  # Environment variables passed to all commands
  # Useful for disabling xdebug, setting test environment
  env:
    XDEBUG_MODE: "off"
    APP_ENV: "test"
    DATABASE_URL: "postgresql://test:test@localhost:5432/test_db?serverVersion=15&charset=utf8"

git:
  # Compare against main branch to detect changes
  base_branch: main

  # Fallback if main doesn't exist (e.g., fresh clone)
  fallback_branch: develop

# File patterns define regex patterns for matching changed files
# These are referenced by check triggers below
file_patterns:
  # All PHP files
  php:
    pattern: '\.php$'
    color: white

  # PHP source files (not tests)
  php_src:
    pattern: '^src/.*\.php$'
    color: blue

  # PHP test files
  php_tests:
    pattern: '^tests/.*\.php$'
    color: green

  # Twig templates
  twig:
    pattern: '\.twig$'
    color: magenta

  # Doctrine migrations
  migrations:
    pattern: '^migrations/.*\.php$'
    color: yellow

  # Configuration files
  config:
    pattern: '^config/.*\.(php|yaml|yml)$'
    color: cyan

# Patterns for files to ignore (never trigger checks)
ignore_patterns:
  - '^vendor/'
  - '^node_modules/'
  - '^var/'
  - '^public/bundles/'
  - '\.md$'
  - '\.txt$'
  - '\.log$'

# Check groups execute sequentially
# Within a group, checks can run in parallel
checks:
  # Group 1: Fast linting checks (run in parallel)
  lint:
    name: Code Linting
    parallel: true
    stop_on_failure: false
    checks:
      # PHP syntax check (very fast, catches parse errors)
      php-syntax:
        name: PHP Syntax Check
        command: |
          for file in {files}; do
            php -l "$file" || exit 1
          done
        triggers:
          file_pattern: php

      # PHP CS Fixer for code style
      # Symfony uses php-cs-fixer natively with .php-cs-fixer.dist.php config
      # fix_command runs when using --fix flag
      php-cs-fixer:
        name: PHP CS Fixer
        command: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose {files}
        fix_command: vendor/bin/php-cs-fixer fix {files}
        triggers:
          file_pattern: php
        env:
          PHP_CS_FIXER_IGNORE_ENV: "1"

  # Group 2: Static analysis (runs after lint group)
  analysis:
    name: Static Analysis
    parallel: false
    stop_on_failure: false
    checks:
      # PHPStan for static analysis
      # Symfony projects typically use phpstan/extension-installer for auto-config
      # Analyzes specific files when source changes
      phpstan:
        name: PHPStan Analysis
        command: vendor/bin/phpstan analyse --memory-limit=2G {files}
        triggers:
          file_pattern: php_src

      # Full project analysis (on-demand only)
      # Trigger manually with 't' key when needed
      phpstan-full:
        name: PHPStan Full Analysis
        command: vendor/bin/phpstan analyse --memory-limit=2G
        on_demand: true

  # Group 3: Tests with database setup
  tests:
    name: Test Suite
    parallel: false
    stop_on_failure: false

    # Commands run before checks in this group
    # Useful for setting up test database
    pre_commands:
      # Run Doctrine migrations in test environment
      - name: Migrate test database
        command: bin/console doctrine:migrations:migrate --no-interaction --env=test
        service: php
        exec: true
        env:
          APP_ENV: test

      # Optional: Load fixtures for test data
      # - name: Load test fixtures
      #   command: bin/console doctrine:fixtures:load --no-interaction --env=test
      #   service: php
      #   exec: true
      #   env:
      #     APP_ENV: test

    checks:
      # PHPUnit with intelligent test discovery
      # Symfony uses PHPUnit with phpunit.xml.dist configuration
      phpunit:
        name: PHPUnit Tests
        command: vendor/bin/phpunit --colors=always {files}
        service: php
        on_demand: false
        triggers:
          # Always run when test files change
          file_pattern: php_tests

          # Discover related tests when source files change
          test_discovery:
            source_pattern: php_src
            strategies:
              # Strategy 1: Path mapping (convention-based)
              # Maps source files to test files by path structure
              # Symfony convention: src/{path}.php -> tests/{path}Test.php
              - type: path_mapping
                rules:
                  # Rule for src/ directory (Symfony standard)
                  # Example: src/Service/UserService.php
                  #       -> tests/Service/UserServiceTest.php
                  #       -> tests/Integration/Service/UserServiceTest.php
                  - source: "src/{path}.php"
                    tests:
                      - "tests/{path}Test.php"
                      - "tests/Integration/{path}Test.php"

                  # Controllers often have functional tests
                  - source: "src/Controller/{path}.php"
                    tests:
                      - "tests/Controller/{path}Test.php"
                      - "tests/Functional/{path}Test.php"

                  # Entities may have unit tests
                  - source: "src/Entity/{path}.php"
                    tests:
                      - "tests/Entity/{path}Test.php"
                      - "tests/Unit/Entity/{path}Test.php"

              # Strategy 2: Grep search (finds indirect references)
              # Searches test files for class names
              # Useful for integration tests that import multiple classes
              - type: grep_search
                search_dirs:
                  - tests/Functional
                  - tests/Integration
                pattern: '(use|class|new)\s+(\w+\\)*{basename}(;|\(|Test)'

      # Functional tests only (useful for API testing)
      phpunit-functional:
        name: Functional Tests Only
        command: vendor/bin/phpunit --colors=always --testsuite=functional {files}
        service: php
        on_demand: true
        triggers:
          file_pattern: php_tests

      # Full test suite without file filtering
      # Marked on-demand so it only runs when manually triggered
      phpunit-full:
        name: Full Test Suite
        command: vendor/bin/phpunit --colors=always
        service: php
        on_demand: true

